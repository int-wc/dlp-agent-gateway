<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DLP Gateway · 运营台</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#13272b;background:#f4f7f5}
    *{box-sizing:border-box}body{margin:0}header{background:#102d30;color:#fff;padding:32px max(24px,calc((100vw - 1120px)/2))}
    header h1{margin:0 0 8px;font-size:30px;letter-spacing:-.03em}header p{margin:0;color:#bdcfcc}
    main{max-width:1120px;margin:28px auto;padding:0 20px 60px}.toolbar,.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
    .panel{background:#fff;border:1px solid #dce7e3;border-radius:16px;padding:20px;box-shadow:0 8px 28px #123b3410;margin-bottom:18px}
    .toolbar{align-items:end}.toolbar .panel{margin:0}.label{font-size:12px;font-weight:700;letter-spacing:.08em;color:#57746e;text-transform:uppercase}
    h2{margin:4px 0 16px;font-size:20px}h3{font-size:15px;margin:18px 0 8px}input,select,button{font:inherit;border-radius:9px;padding:10px 12px}
    input,select{width:100%;border:1px solid #bfcfc9;background:#fff}button{border:0;background:#126e61;color:#fff;font-weight:650;cursor:pointer}
    button.secondary{background:#e9f2ee;color:#164a42}button.danger{background:#9d4a37}button:disabled{opacity:.5;cursor:default}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.muted{color:#66817a;font-size:13px}
    .stat{font-size:32px;font-weight:750;margin-top:8px}.allow{color:#188166}.review{color:#ad6f19}.block{color:#b14e39}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e7eeeb;vertical-align:top}
    th{color:#5a756e;font-weight:600}td{overflow-wrap:anywhere}.scroll{overflow:auto}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf1ee;white-space:nowrap}
    small{color:#647d77}.notice{min-height:20px;margin:12px 0;color:#9d4a37}form{display:grid;gap:10px}.summary{font-size:14px}.empty{color:#66817a;text-align:center;padding:22px 8px}.result{white-space:pre-wrap;background:#f4f7f5;border-radius:10px;padding:12px;min-height:44px}
  </style>
</head>
<body>
<header><div class="label" style="color:#7fd8bd">LOCAL REFERENCE · v0.2</div><h1>DLP 智能上传网关</h1><p>策略执行、审计和人工复核；模型只参与建议，不自动放宽硬阻断。</p></header>
<main>
  <div class="toolbar">
    <section class="panel"><div class="label">管理员会话</div><h2>连接运营台</h2><div class="row"><input id="token" aria-label="管理员密钥" type="password" autocomplete="off" placeholder="管理员密钥（仅保留在当前页面）"><button id="connect">连接</button></div><small>仅在本机或可信 HTTPS 环境打开。页面不保存密钥。</small></section>
    <section class="panel"><div class="label">运行状态</div><h2 id="runtime-status">正在读取…</h2><div id="runtime-detail" class="summary">上传默认不外发；请勿用真实敏感文件做演示。</div></section>
  </div>
  <section class="panel"><div class="label">合成数据验收</div><h2>检查测试文件</h2><p class="muted">这里只调用检查接口，不会转发文件。请仅选择自己创建的虚构测试文件。</p><form id="check-form"><div class="row"><input id="client-token" aria-label="客户端密钥" type="password" autocomplete="off" placeholder="客户端密钥（不会保存）" required><select id="check-destination" aria-label="检查目标"><option value="external-demo">external-demo</option><option value="internal-demo">internal-demo</option></select><input id="check-file" aria-label="合成测试文件" type="file" required><button>开始检查</button></div></form><div id="check-result" class="result muted">尚未提交测试文件。</div></section>
  <p id="notice" class="notice" role="status"></p>
  <div class="grid" id="stats"></div>
  <section class="panel"><div class="row"><h2>最近审计</h2><button class="secondary" id="refresh">刷新</button></div><div class="scroll"><table><thead><tr><th>时间 / ID</th><th>身份 / 目标</th><th>文件</th><th>判定 / 原因</th><th>传输</th><th>复核</th></tr></thead><tbody id="audits"></tbody></table></div></section>
  <div class="grid">
    <section class="panel"><h2>策略配置</h2><form id="policy-form"><input name="keyword" aria-label="策略关键词" placeholder="敏感关键词，如 内部机密" required minlength="2" maxlength="64"><div class="row"><select name="action" aria-label="策略动作"><option value="review">人工复核</option><option value="block">阻断</option></select><select name="scope" aria-label="策略范围"><option value="external">仅外部</option><option value="all">全部</option><option value="internal">仅内部</option></select></div><button>添加策略</button></form><div id="policies"></div></section>
    <section class="panel"><h2>重点人员</h2><div id="users"></div><h2 style="margin-top:28px">短时例外申请</h2><div id="exceptions"></div></section>
  </div>
  <section class="panel"><h2>误报与优化建议</h2><p class="muted">反馈只生成候选建议，策略仍须人工审核修改。</p><div id="suggestions" class="summary"></div></section>
</main>
<script>
  const $=id=>document.getElementById(id);let token="";
  const note=message=>{$("notice").textContent=message};
  const asArray=value=>Array.isArray(value)?value:[];
  const transferLabel=value=>({not_requested:"未请求",not_attempted:"未尝试",pending:"处理中",not_configured:"未配置",failed:"失败",forwarded:"已转发"}[value]||value||"未知");
  const displayTime=value=>{const date=new Date(value);return Number.isNaN(date.getTime())?value:date.toLocaleString("zh-CN",{hour12:false})};
  const cell=(row,value)=>{const td=document.createElement("td");td.textContent=String(value??"");row.append(td);return td};
  const button=(label,fn,cls="secondary")=>{const b=document.createElement("button");b.textContent=label;b.className=cls;b.onclick=fn;return b};
  async function api(path,options={}){
    if(!token)throw Error("先输入管理员密钥");
    const response=await fetch(path,{...options,headers:{Authorization:"Bearer "+token,...(options.body?{"Content-Type":"application/json"}:{})}});
    const data=await response.json();if(!response.ok)throw Error(typeof data.detail==="string"?data.detail:JSON.stringify(data.detail));return data;
  }
  const run=fn=>async()=>{try{note("");await fn()}catch(e){note(e.message)}};
  async function refresh(){
    let [audits,report,policies,users,exceptions]=await Promise.all([
      api("/v1/admin/audits"),api("/v1/admin/report"),api("/v1/admin/policies"),api("/v1/admin/users"),api("/v1/admin/exceptions")]);
    audits=asArray(audits);policies=asArray(policies);users=asArray(users);exceptions=asArray(exceptions);
    $("stats").replaceChildren();for(const action of ["allow","review","block"]){
      const count=report.counts[action]||0;
      const div=document.createElement("div");div.className="panel";
      const label=document.createElement("div");label.className="label";label.textContent="近 7 天 · "+action;
      const value=document.createElement("div");value.className="stat "+action;value.textContent=count;div.append(label,value);$("stats").append(div);
    }
    $("audits").replaceChildren();for(const item of audits){
      const tr=document.createElement("tr");cell(tr,displayTime(item.created_at)+" #"+item.id);cell(tr,item.actor+" → "+item.destination);
      const reasons=asArray(item.reasons);cell(tr,item.filename+" ("+item.size+" B)");cell(tr,item.action+" · "+(reasons.length?reasons.join(", "):"无命中"));
      const transfer=cell(tr,"");const badge=document.createElement("span");badge.className="pill";badge.textContent=transferLabel(item.transfer_status);transfer.append(badge);
      const td=cell(tr,"");if(item.action!=="allow")td.append(button("误报",run(async()=>{await api("/v1/admin/audits/"+item.id+"/feedback",{method:"PUT",body:JSON.stringify({verdict:"false_positive"})});await refresh()})));else td.textContent="—";
      $("audits").append(tr);
    }
    if(!audits.length){const tr=document.createElement("tr");const td=cell(tr,"暂无审计记录。请用上方合成文件完成第一次检查。");td.colSpan=6;td.className="empty";$("audits").append(tr)}
    $("policies").replaceChildren();for(const p of policies){
      const line=document.createElement("p");line.className="summary";line.textContent="#"+p.id+" · "+p.keyword+" · "+p.action+" / "+p.scope+" · "+(p.enabled?"启用":"停用")+" ";
      line.append(button(p.enabled?"停用":"启用",run(async()=>{await api("/v1/admin/policies/"+p.id,{method:"PUT",body:JSON.stringify({...p,enabled:!p.enabled})});await refresh()})));$("policies").append(line);
    }
    if(!policies.length){$("policies").textContent="暂无自定义策略。";$("policies").className="empty"}else{$("policies").className=""}
    $("users").replaceChildren();for(const user of users){
      const line=document.createElement("p");line.className="summary";line.textContent=user.actor+" · "+user.status+" ";
      const select=document.createElement("select");for(const status of ["normal","privileged","departing"]){const o=document.createElement("option");o.value=status;o.textContent=status;select.append(o)}select.value=user.status;select.style.width="auto";
      line.append(select,button("更新",run(async()=>{await api("/v1/admin/users/"+encodeURIComponent(user.actor),{method:"PUT",body:JSON.stringify({status:select.value})});await refresh()})));$("users").append(line);
    }
    if(!users.length){$("users").textContent="暂无已配置身份。";$("users").className="empty"}else{$("users").className=""}
    $("exceptions").replaceChildren();for(const item of exceptions){
      const line=document.createElement("p");line.className="summary";line.textContent="#"+item.id+" · "+item.actor+" → "+item.destination+" · "+item.status+" · "+item.justification+" ";
      if(item.status==="pending")line.append(button("批准 1 小时",run(async()=>{await api("/v1/admin/exceptions/"+item.id+"/approve",{method:"POST",body:JSON.stringify({hours:1})});await refresh()})));
      $("exceptions").append(line);
    }
    if(!exceptions.length){$("exceptions").textContent="暂无例外申请。";$("exceptions").className="empty"}else{$("exceptions").className=""}
    $("suggestions").textContent=Object.entries(report.false_positive_policy_candidates).map(([k,v])=>k+"："+v+" 条误报反馈").join("；")||"暂无需要复盘的误报策略。";
  }
  $("connect").onclick=run(async()=>{token=$("token").value;$("token").value="";await refresh()});
  $("refresh").onclick=run(refresh);
  $("check-form").onsubmit=event=>{event.preventDefault();run(async()=>{
    const clientToken=$("client-token").value;const file=$("check-file").files[0];const destination=$("check-destination").value;
    if(!clientToken||!file)throw Error("请输入客户端密钥并选择合成测试文件");
    const body=new FormData();body.append("file",file);
    const response=await fetch("/v1/check/"+encodeURIComponent(destination),{method:"POST",headers:{Authorization:"Bearer "+clientToken},body});
    const data=await response.json();$("check-result").className="result";$("check-result").textContent=JSON.stringify(data,null,2);
    if(!response.ok)throw Error(typeof data.detail==="string"?data.detail:JSON.stringify(data.detail));
    if(token)await refresh();
  })()};
  $("policy-form").onsubmit=event=>{event.preventDefault();run(async()=>{
    const form=event.target;const payload=Object.fromEntries(new FormData(form));
    await api("/v1/admin/policies",{method:"POST",body:JSON.stringify(payload)});form.reset();await refresh();
  })()};
  fetch("/health").then(response=>response.json()).then(data=>{$("runtime-status").textContent="Gateway "+data.version+" · 正常";$("runtime-detail").textContent="文档解析："+(data.analyzer_enabled?"已启用":"仅文本模式")+"；本地模型："+(data.model_enabled?"已启用":"未启用")}).catch(()=>{$("runtime-status").textContent="状态读取失败"});
</script>
</body>
</html>
