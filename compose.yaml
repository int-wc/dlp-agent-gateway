services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    env_file: .env
    environment:
      DLP_DB_PATH: /data/audit.json
      DLP_LISTEN_ADDRESS: 0.0.0.0:18080
      DLP_ANALYZER_URL: http://analyzer:19090
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - dlp-data:/data
    depends_on:
      analyzer:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.analyzer
    expose:
      - "19090"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19090/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  dlp-data:
