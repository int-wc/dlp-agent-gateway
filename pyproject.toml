[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dlp-agent-gateway"
version = "0.2.0"
description = "A privacy-first, fail-closed DLP upload gateway reference implementation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]
ocr = ["pillow>=11,<13", "pytesseract>=0.3.13,<1"]

[tool.setuptools.packages.find]
include = ["dlp_gateway*"]

[tool.setuptools.package-data]
dlp_gateway = ["console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
