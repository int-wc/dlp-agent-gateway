name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dlp_test
          POSTGRES_USER: dlp_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dlp_test -d dlp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go vet ./...
      - run: go test -race ./...
        env:
          DLP_TEST_DATABASE_URL: postgres://dlp_test:synthetic-ci-password@127.0.0.1:5432/dlp_test?sslmode=disable
      - run: go build -o /tmp/dlp-gateway ./cmd/dlp-gateway
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: docker build -f Dockerfile.gateway -t dlp-gateway:test .
      - run: docker build -f Dockerfile.analyzer -t dlp-analyzer:test .
