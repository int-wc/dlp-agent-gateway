name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /tmp/dlp-gateway ./cmd/dlp-gateway
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: docker build -f Dockerfile.gateway -t dlp-gateway:test .
      - run: docker build -f Dockerfile.analyzer -t dlp-analyzer:test .
