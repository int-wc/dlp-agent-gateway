services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    env_file: .env
    environment:
      DLP_DATABASE_URL: postgres://dlp:${DLP_DB_PASSWORD}@postgres:5432/dlp?sslmode=disable
      DLP_LISTEN_ADDRESS: 0.0.0.0:18080
      DLP_ANALYZER_URL: http://analyzer:19090
    ports:
      - "127.0.0.1:18080:18080"
    depends_on:
      analyzer:
        condition: service_healthy
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dlp
      POSTGRES_USER: dlp
      POSTGRES_PASSWORD: ${DLP_DB_PASSWORD}
    volumes:
      - dlp-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlp -d dlp"]
      interval: 5s
      timeout: 3s
      retries: 10
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.analyzer
    expose:
      - "19090"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19090/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  dlp-postgres:
